<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link
      rel="alternate icon"
      type="image/png"
      href="https://docs.rs/-/rustdoc.static/favicon-16x16-8b506e7a72182f1c.png"
    />
    <link
      rel="alternate icon"
      type="image/png"
      href="https://docs.rs/-/rustdoc.static/favicon-32x32-422f7d1d52889060.png"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="https://docs.rs/-/rustdoc.static/favicon-2c020d218678b618.svg"
    />
    <title>Rust Regex Playground</title>
    <!--
      Resolve the theme before first paint (same rules as src/theme.ts):
      the stored choice if the user picked one, otherwise the OS preference.
    -->
    <script>
      try {
        const theme = localStorage.getItem('theme')
        const dark =
          theme === 'dark' ||
          (theme !== 'light' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      } catch {}
    </script>
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link href="./src/index.css" rel="stylesheet" />
    <script async type="module" src="./src/index.tsx"></script>
  </head>
  <body>
    <div id="root">
      <header class="border-b border-line">
        <div
          class="mx-auto flex max-w-app items-center gap-2 px-5 py-3 text-[13px]"
        >
          <span class="text-accent">❯</span>
          <span class="font-bold">rust-regex</span>
          <span class="text-fg-dim">playground</span>
        </div>
      </header>
    </div>
  </body>
</html>
