name: pull request

on:
  pull_request:
    branches:
      - dependabot/*

jobs:
  release:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: installing
        run: pnpm install --frozen-lockfile

      - name: checking
        run: pnpm check

      - name: building
        run: pnpm build
